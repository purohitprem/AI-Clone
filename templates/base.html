<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Prem AI Clone{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#2563eb",
              darkbg: "#0f172a",
            },
            boxShadow: {
              glow: "0 0 20px rgba(37,99,235,.35)"
            }
          }
        }
      }
    </script>

    <script>
      (function () {
        const setAppHeight = () => {
          const hasVisualViewport = Boolean(window.visualViewport);
          const viewportHeight = hasVisualViewport ? window.visualViewport.height : window.innerHeight;
          const viewportTop = hasVisualViewport ? window.visualViewport.offsetTop : 0;
          const keyboardOffset = Math.max(0, window.innerHeight - (viewportHeight + viewportTop));

          document.documentElement.style.setProperty("--app-height", `${Math.round(viewportHeight)}px`);
          document.documentElement.style.setProperty("--kb-offset", `${Math.round(keyboardOffset)}px`);
        };

        const scheduleSetAppHeight = () => window.setTimeout(setAppHeight, 50);

        setAppHeight();
        window.addEventListener("resize", scheduleSetAppHeight);
        window.addEventListener("orientationchange", scheduleSetAppHeight);
        window.addEventListener("pageshow", scheduleSetAppHeight);
        window.addEventListener("focusin", scheduleSetAppHeight);
        window.addEventListener("focusout", scheduleSetAppHeight);

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleSetAppHeight);
          window.visualViewport.addEventListener("scroll", scheduleSetAppHeight);
        }
      })();
    </script>

    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Inter, sans-serif;
        }

        .app-shell {
            height: var(--app-height, 100vh);
            max-height: var(--app-height, 100vh);
            width: 100%;
        }

        .safe-bottom {
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }

        .input-dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: var(--kb-offset, 0px);
            z-index: 30;
        }

        @media (min-width: 768px) {
            .input-dock {
                position: static;
            }
        }

        .glass {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .dark .glass {
            background: rgba(15,23,42,0.75);
            border-color: rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 dark:bg-darkbg dark:text-slate-100 transition-colors duration-300 overflow-hidden">
    {% block content %}{% endblock %}
</body>
</html>
