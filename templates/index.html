{% extends "base.html" %}
{% block title %}Prem AI Clone{% endblock %}
{% block content %}

<!-- MAIN WRAPPER -->
<div class="app-shell flex overflow-hidden relative">

    <!-- MAIN CHAT -->
    <main class="flex-1 min-h-0 w-full flex flex-col bg-transparent">

        <!-- HEADER -->
        <header class="shrink-0 h-16 md:h-20 relative flex items-center
            px-3 sm:px-4 md:px-8
            glass border-b border-slate-200 dark:border-slate-800">

                <h2 class="absolute left-1/2 -translate-x-1/2 text-base sm:text-lg font-bold
bg-gradient-to-r from-cyan-500 to-blue-600 bg-clip-text text-transparent">
                    Prem AI Clone
                </h2>
        </header>

        <!-- CHAT AREA -->
        <div id="chat-box"
            class="flex-1 min-h-0 overflow-y-auto
            p-3 sm:p-4 md:p-8 pb-28 sm:pb-32 md:pb-8
            space-y-4 sm:space-y-6
            max-w-5xl mx-auto w-full
            relative z-10">
        </div>

        <!-- INPUT -->
        <div class="input-dock safe-bottom shrink-0 p-3 sm:p-4 md:p-6 border-t border-slate-200 dark:border-slate-800 glass">

            <div class="max-w-4xl mx-auto relative">

                <div class="absolute -inset-0.5
                bg-gradient-to-r from-primary to-cyan-500
                rounded-2xl blur opacity-20 pointer-events-none"></div>

                <div class="fixed z-20 glass rounded-2xl p-2 flex items-center gap-2">

                    <input id="user-input"
                    type="text"
                    placeholder="Message Prem AI..."
                    class="relative z-10 flex-1 min-w-0 bg-transparent px-3 sm:px-4 py-2.5 sm:py-3
                    border-none focus:ring-0
                    text-sm sm:text-base text-slate-800 dark:text-slate-100"
                    onkeydown="handleEnter(event)">

                    <button onclick="startMic()"
                    class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 flex items-center justify-center
                    text-slate-400 hover:text-primary transition">
                        🎤
                    </button>

                    <button onclick="sendMessage()"
                    class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 bg-primary text-white rounded-xl
                    shadow-glow hover:scale-105 transition">
                        ➤
                    </button>

                </div>
            </div>
        </div>
    </main>
</div>

    <!-- MIC OVERLAY -->
    <div id="micOverlay"
        class="hidden fixed inset-0 bg-black/30 backdrop-blur
        flex items-center justify-center z-[999]">

        <div class="glass p-8 sm:p-12 rounded-3xl shadow-xl text-center mx-4">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-primary rounded-full mx-auto
            flex items-center justify-center shadow-glow animate-pulse">
                🎤
            </div>
            <p class="mt-4 font-semibold text-base sm:text-lg">Listening...</p>
            <p class="text-slate-400 text-sm">Speak now</p>
        </div>
    </div>

<!-- PDF LOADER -->
<div id="pdfLoader"
class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">

    <div class="glass p-6 rounded-xl flex items-center gap-3">
        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-primary"></div>
        Generating PDF...
    </div>
</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
